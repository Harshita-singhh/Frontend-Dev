<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Head Elements Demo</title>
  <!-- meta: provides metadata like charset, description, author -->
  <meta name="description" content="Demo of head elements">
  <meta name="author" content="HARSHITA">
  <!-- base: sets the base URL for relative links (example) -->
  <base href="/">
  <!-- link: used to link external resources like favicons or stylesheets -->
  <link rel="icon" href="#">
  <!-- style: internal CSS (empty here) -->
  <style></style>
  <!-- script: external or inline JS (empty here) -->
  <script></script>
</head>
<body>
  <h1>Head Elements</h1>
  <p>Comments in the head explain each tag's purpose.</p>
</body>
</html>

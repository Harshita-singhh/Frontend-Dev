<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Contact Form</title></head>
<body>
  <h1>Contact</h1>
  <form>
    <label>Full Name: <input type="text" name="name" placeholder="Your name" required></label><br>
    <label>Email: <input type="email" name="email" placeholder="you@example.com" required></label><br>
    <label>Subject: <input type="text" name="subject" placeholder="Subject" required></label><br>
    <label>Message:<br><textarea name="message" placeholder="Your message" required></textarea></label><br>
    <button type="submit">Send</button>
  </form>

  <h2>Preview (iframe)</h2>
  <iframe srcdoc="&lt;p&gt;Form will be submitted to the server.&lt;/p&gt;" style="width:100%;height:80px;border:1px solid #ccc;"></iframe>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>User Registration</title></head>
<body>
  <h1>Register</h1>
  <form>
    <label>Full Name: <input type="text" name="fullname" required></label><br>
    <label>Email: <input type="email" name="email" required></label><br>
    <label>Password: <input type="password" name="password" required></label><br>
    <label>Confirm Password: <input type="password" name="confirm" required></label><br>
    <button type="submit">Register</button>
  </form>

  <h2>Form Preview (iframe)</h2>
  <iframe srcdoc="&lt;form&gt;&lt;label&gt;Name: &lt;input&gt;&lt;/label&gt;&lt;/form&gt;" style="width:100%;height:120px;border:1px solid #ccc;"></iframe>
</body>
</html>

<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Payment Form</title></head>
<body>
  <h1>Payment</h1>
  <form>
    <label>Cardholder Name: <input type="text" name="cardname" required></label><br>
    <label>Card Number: <input type="text" name="cardnumber" required></label><br>
    <label>Expiry Date: <input type="month" name="expiry" required></label><br>
    <label>CVV: <input type="text" name="cvv" required></label><br>
    <button type="submit">Pay Now</button>
  </form>

  <h2>Preview (iframe)</h2>
  <iframe srcdoc="&lt;p&gt;Payment preview&lt;/p&gt;" style="width:100%;height:80px;border:1px solid #ccc;"></iframe>
</body>
</html>

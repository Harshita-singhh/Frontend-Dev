<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Feedback</title></head>
<body>
  <h1>Feedback</h1>
  <form method="post" action="#">
    <label>Feedback:<br><textarea name="feedback" rows="5" cols="40"></textarea></label><br>
    <label><input type="radio" name="rating" value="good"> Good</label>
    <label><input type="radio" name="rating" value="average"> Average</label>
    <label><input type="radio" name="rating" value="poor"> Poor</label><br>
    <button type="submit">Submit</button>
  </form>
</body>
</html>

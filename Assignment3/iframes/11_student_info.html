<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Student Info</title></head>
<body>
  <h1>Student Information</h1>
  <form>
    <label>Name: <input type="text" name="name" required></label><br>
    <label>Roll Number: <input type="text" name="roll" required></label><br>
    <label>Course: <select name="course" required>
      <option disabled selected>Select Course</option>
      <option>BSc</option>
      <option>BCom</option>
    </select></label><br>
    <button type="submit">Submit</button>
  </form>

  <h2>Preview (iframe)</h2>
  <iframe srcdoc="&lt;p&gt;Student info preview&lt;/p&gt;" style="width:100%;height:80px;border:1px solid #ccc;"></iframe>
</body>
</html>

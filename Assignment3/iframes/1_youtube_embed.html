<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Embed (Responsive %)</title>
</head>
<body>
  <h1>YouTube Video (percentage width/height)</h1>
  <!-- The iframe uses percentage width/height so it scales when the browser resizes -->
  <iframe width="80%" height="40%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video" frameborder="0" allowfullscreen></iframe>
</body>
</html>

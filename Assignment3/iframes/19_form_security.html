<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Form Security</title></head>
<body>
  <h1>Secure Form</h1>
  <form autocomplete="off">
    <label>Name: <input type="text" name="name" required></label><br>
    <label>Email: <input type="email" name="email" required></label><br>
    <button type="submit">Submit</button>
  </form>
  <p>Note: Turning off autocomplete can help prevent browsers from storing sensitive data locally, reducing exposure on shared devices.</p>

  <h2>Preview (iframe)</h2>
  <iframe srcdoc="&lt;p&gt;Secure form preview&lt;/p&gt;" style="width:100%;height:60px;border:1px solid #ccc;"></iframe>
</body>
</html>

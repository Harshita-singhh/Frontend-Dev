<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Quotes</title></head>
<body>
  <blockquote>
    This is a long quote demonstrating the blockquote element. It even includes an entity like &amp; to show usage.
  </blockquote>
  <p>He said <q>short quote</q> when asked about practice.</p>

  <h2>Preview (iframe)</h2>
  <iframe srcdoc="&lt;blockquote&gt;Short iframe quote&lt;/blockquote&gt;" style="width:100%;height:80px;border:1px solid #ccc;"></iframe>
</body>
</html>

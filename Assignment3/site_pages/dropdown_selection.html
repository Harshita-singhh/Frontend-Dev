<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Dropdown Selection</title>
</head>
<body>
  <h1>Selection</h1>
  <form>
    <label>Country: <select><option selected>India</option><option>USA</option></select></label><br>
    <label>State: <select><option selected>Karnataka</option><option>Maharashtra</option></select></label><br>
    <label>City: <select><option selected>Bengaluru</option><option>Mumbai</option></select></label><br>
    <label>Favorite Place: <select><option selected>Beach</option><option>Mountain</option></select></label>
  </form>
  <p>You selected: India, Karnataka, Bengaluru, Beach</p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Course Registration</title>
</head>
<body>
  <h1>Course Registration</h1>
  <form>
    <fieldset>
      <legend>Student Info</legend>
      <label>Name: <input type="text" name="name"></label><br>
      <label>Email: <input type="email" name="email"></label>
    </fieldset>
    <fieldset>
      <legend>Course Selection</legend>
      <label>Course: <select name="course"><option selected>Web Design</option><option>Data Science</option></select></label>
    </fieldset>
  </form>
  <h2>Schedules</h2>
  <table border="1">
    <thead><tr><th>Day</th><th>Time</th><th>Instructor</th></tr></thead>
    <tbody>
      <tr><td>Mon</td><td>10:00</td><td>Dr. A</td></tr>
    </tbody>
  </table>
</body>
</html>

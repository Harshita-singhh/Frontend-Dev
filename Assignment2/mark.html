<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Highlight and Note</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 2rem; }
        .note { margin-top: 1rem; color: #666; }
    </style>
</head>
<body>
    <h1>Highlight Example</h1>
    <p>
        I enjoy learning new web techniques; my most recent discovery is the <mark>CSS Grid</mark> layout.
        It makes building complex responsive layouts much simpler and more intuitive.
    </p>
    <p class="note"><small>Updated recently</small></p>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Header with Nav</title>
  <style>
    header { background:#1a73e8; color:#fff; padding:1rem; text-align:center; }
    nav { background:#f1f1f1; padding:0.5rem; text-align:center; }
    nav a { margin:0 1rem; color:#1a73e8; text-decoration:none; font-weight:600; }
    nav a:hover { text-decoration:underline; }
  </style>
</head>
<body>
  <header>
    <h1>My Simple Website</h1>
  </header>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
  <main style="padding:1rem;">
    <p>This page demonstrates a header followed by a simple navigation bar with placeholder links.</p>
  </main>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Blockquote Example</title>
    <style>
        body { font-family: 'Times New Roman', serif; padding: 2rem; }
        blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 4px solid #888; color: #222; }
        cite { display: block; margin-top: 0.5rem; font-style: italic; color: #555; }
    </style>
</head>
<body>
    <h1>Blockquote</h1>
    <blockquote>
        "In the end, we will remember not the words of our enemies, but the silence of our friends."
        <cite>— Martin Luther King Jr.</cite>
    </blockquote>
</body>
</html>

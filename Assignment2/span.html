<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Span Example</title>
  <style>
    .tag { display:inline-block; padding:0.15rem 0.4rem; margin-right:0.5rem; border-radius:4px; color:#fff; font-size:0.9rem; }
    .tag.red { background:#e74c3c; }
    .tag.green { background:#27ae60; }
    .tag.blue { background:#3498db; }
    p { font-family: Arial, sans-serif; }
  </style>
</head>
<body>
  <h1>Span Labels</h1>
  <p>
    Here is a sentence that highlights three parts using <span class="tag red">priority</span>
    <span class="tag green">status</span> and <span class="tag blue">category</span> labels to clarify meaning.
  </p>
</body>
</html>

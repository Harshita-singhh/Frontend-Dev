<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Strong and Emphasis Example</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
  </style>
</head>
<body>
  <h1>Emphasis Demo</h1>
  <p>
    I enjoy working on web projects because clear structure is <strong>essential</strong> for usability,
    and a friendly tone makes content feel <em>approachable</em> to readers.
  </p>
</body>
</html>

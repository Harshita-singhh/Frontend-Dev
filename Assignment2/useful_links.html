<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Useful Links</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 2rem; }
    aside { background:#f9f9f9; border:1px solid #e0e0e0; padding:1rem; max-width:400px; }
    aside h2 { margin-top:0; color:#1a73e8; }
    aside a { color:#0b8043; text-decoration:none; display:block; margin:0.4rem 0; }
  </style>
</head>
<body>
  <aside>
    <h2>Useful Links</h2>
    <a href="https://your-portfolio.example.com" target="_blank" rel="noopener">My Portfolio (placeholder)</a>
    <a href="https://www.example.com" target="_blank" rel="noopener">Example.com</a>
  </aside>
</body>
</html>

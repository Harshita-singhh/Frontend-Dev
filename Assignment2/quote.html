<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Quote Example</title>
    <style>
        body { font-family: Georgia, 'Times New Roman', serif; padding: 2rem; }
        blockquote { border-left: 4px solid #ccc; margin: 1.5rem 0; padding: 0.5rem 1rem; color: #333; }
        cite { display: block; margin-top: 0.5rem; font-style: normal; color: #666; }
    </style>
</head>
<body>
    <h1>Quote</h1>
    <blockquote>
        "The more that you read, the more things you will know. The more that you learn, the more places you'll go."
        <cite>— Dr. Seuss</cite>
    </blockquote>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Website Header</title>
  <style>
    header { background:#1a73e8; color:#fff; padding:1.5rem; text-align:center; }
    h1 { margin:0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  </style>
</head>
<body>
  <header>
    <h1>My Simple Website</h1>
  </header>
  <main>
    <p style="padding:1rem;">Welcome — this page demonstrates a header with an <code>&lt;h1&gt;</code> title.</p>
  </main>
</body>
</html>

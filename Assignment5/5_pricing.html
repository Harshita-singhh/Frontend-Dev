<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>5 - Pricing Table</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:2rem;background:#f4f6f8}
    .plans{display:flex;gap:1rem;max-width:1000px;margin:0 auto}
    .plan{flex:1;background:#fff;padding:1.5rem;border:2px solid #e2e8f0;border-radius:8px;display:flex;flex-direction:column;align-items:stretch;transition:transform .2s ease,background .2s}
    .plan:hover{transform:scale(1.03);background:#f0fbff}
    .popular{border-color:#ff7e5f;background:#fff7f0}
    .features{flex:1}
    .price{font-size:2rem;margin:1rem 0}
    .btn{display:inline-block;padding:.6rem 1rem;background:#0a74da;color:#fff;text-decoration:none;border-radius:4px}
    @media(max-width:700px){.plans{flex-direction:column}}
  </style>
</head>
<body>
  <h1 style="text-align:center">Pricing</h1>
  <div class="plans">
    <div class="plan"><h2>Basic</h2><div class="features"><ul><li>Feature A</li><li>Feature B</li></ul></div><div class="price">$5</div><a class="btn" href="#">Choose</a></div>
    <div class="plan popular"><h2>Standard</h2><div class="features"><ul><li>Feature A</li><li>Feature B</li><li>Feature C</li></ul></div><div class="price">$15</div><a class="btn" href="#">Choose</a></div>
    <div class="plan"><h2>Premium</h2><div class="features"><ul><li>All Features</li><li>Priority Support</li></ul></div><div class="price">$29</div><a class="btn" href="#">Choose</a></div>
  </div>
</body>
</html>

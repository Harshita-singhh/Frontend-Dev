<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>8 - Dashboard</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body,html{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif}
    header{position:fixed;top:0;left:0;right:0;height:60px;background:#0a74da;color:#fff;display:flex;align-items:center;padding:0 1rem;z-index:2}
    .layout{display:flex;height:100vh;padding-top:60px}
    aside{width:220px;background:#f4f6f8;padding:1rem;height:calc(100vh - 60px);overflow:auto}
    main{flex:1;padding:1rem;display:flex;flex-direction:column;gap:1rem}
    .box{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,0.06);flex:1}
    @media(max-width:800px){.layout{flex-direction:column}aside{width:100%;height:auto}}
  </style>
</head>
<body>
  <header><h1>Dashboard</h1></header>
  <div class="layout">
    <aside><nav><strong>Harshita's Dashboard</strong><br><a href="#">Overview</a><br><a href="#">Reports</a></nav></aside>
    <main>
      <div class="box">Overview Widgets: Users, Sessions, Conversions</div>
      <div class="box">Recent Activity and Reports</div>
    </main>
  </div>
</body>
</html>

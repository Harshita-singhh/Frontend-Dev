<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>6 - Photo Gallery</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:1rem;background:#fafafa}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;max-width:1100px;margin:0 auto}
    .item{position:relative;overflow:hidden;border-radius:8px}
    .item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease}
    .item:hover img{transform:scale(1.08)}
    .caption{position:absolute;left:0;right:0;bottom:0;padding:.5rem;background:rgba(0,0,0,0.6);color:#fff;opacity:0;transition:opacity .2s}
    .item:hover .caption{opacity:1}
  </style>
</head>
<body>
  <h1 style="text-align:center">Gallery</h1>
  <div class="grid">
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 1</div></div>
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 2</div></div>
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 3</div></div>
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 4</div></div>
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 5</div></div>
    <div class="item"><img src="https://via.placeholder.com/600x400" alt=""><div class="caption">Caption 6</div></div>
  </div>
</body>
</html>

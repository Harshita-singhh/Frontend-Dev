<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>10 - Master Layout</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    :root{--accent:rgba(10,116,218,0.9)}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif}
    header{position:sticky;top:0;background:var(--accent);color:#fff;padding:1rem}
    .hero{height:60vh;background:url('https://via.placeholder.com/1600x800') center/cover;display:flex;align-items:center;justify-content:center;color:#fff}
    .about{display:flex;gap:1rem;padding:2rem}
    .about img{width:40%;max-width:300px}
    .services{display:flex;gap:1rem;padding:2rem}
    .services .box{flex:1;padding:1rem;border:1px solid #ddd}
    .contact{padding:2rem}
    footer{background:#222;color:#fff;padding:1rem;text-align:center}
    /* positioning examples */
    .abs-example{position:relative}
    .abs-box{position:absolute;right:1rem;top:1rem;background:rgba(255,255,255,0.9);padding:.5rem;border:1px solid #ccc}
  </style>
</head>
<body>
  <header><nav><a href="#" style="color:#fff;margin-right:1rem">Home</a><a href="#" style="color:#fff">About</a></nav></header>
  <section class="hero"><h1>Welcome</h1></section>
  <section class="about"><div style="flex:1"><h2>About</h2><p>Text</p></div><img src="https://via.placeholder.com/300" alt=""></section>
  <section class="services"><div class="box">Service 1</div><div class="box">Service 2</div><div class="box">Service 3</div></section>
  <section class="contact"><h2>Contact</h2><form><input placeholder="Name"><br><button>Send</button></form></section>
  <footer>&copy; 2025</footer>
</body>
</html>

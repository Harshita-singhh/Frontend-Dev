<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>3 - Team Members</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:2rem;background:#f0f2f5}
    .team{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;max-width:1000px;margin:0 auto}
    .card{background:#fff;padding:1rem;border:2px solid #e2e8f0;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,0.06)}
    .lead{background:#ffe6b3;border-color:#ffb347}
    @media(max-width:600px){.team{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1 style="text-align:center">Our Team</h1>
  <div class="team">
    <div class="card lead"><h3>Alex (Team Lead)</h3><p>Role: Lead Developer</p><p>Short description about leadership.</p></div>
    <div class="card"><h3>Sam</h3><p>Role: Designer</p><p>Short description about design work.</p></div>
    <div class="card"><h3>Riley</h3><p>Role: QA</p><p>Short description about testing and quality.</p></div>
  </div>
</body>
</html>

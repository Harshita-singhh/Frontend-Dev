<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UI Components Page</title>
<style>
	:root { --bg:#eef2ff; --card:#ffffff; --text:#0f172a; --muted:#6b7280; --primary:#6366f1; }
	* { box-sizing: border-box; }
	body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family: Inter, system-ui, Segoe UI, Roboto, Arial; background: linear-gradient(180deg, #eef2ff, #e0e7ff); color: var(--text); }
	.card {
		width: min(680px, 92vw);
		background: var(--card);
		border-radius: 16px;
		box-shadow: 0 22px 60px rgba(0,0,0,.12);
		padding: 20px;
		display: flex;
		flex-direction: column;
		gap: 14px;
	}
	.header { display:flex; align-items:center; justify-content:space-between; gap: 10px; }
	.search {
		display:flex; align-items:center; gap: 8px; flex:1;
		background:#f1f5f9; padding: 10px 12px; border-radius: 12px; border:1px solid transparent; transition: border-color .2s;
	}
	.search:focus-within { border-color: var(--primary); }
	.search input {
		border: none; background: transparent; outline: none; flex: 1; font: inherit; color: inherit;
	}
	.btns { display:flex; gap: 8px; }
	button, select {
		font: inherit; padding: 10px 14px; border-radius: 10px; border:1px solid #e2e8f0; background:#fff; box-shadow: 0 6px 16px rgba(0,0,0,.08); transition:.2s; cursor:pointer;
	}
	button:hover, select:hover { transform: translateY(-1px); }
	button:focus, select:focus, .search input:focus { outline: 3px solid rgba(99,102,241,.3); outline-offset: 2px; }
	button:active { transform: translateY(0); }
	.content { background:#f8fafc; border-radius:12px; padding: 14px; color: var(--muted); }
</style>
</head>
<body>
	<div class="card">
		<div class="header">
			<div class="search">
				<span>🔎</span>
				<input type="text" placeholder="Search..." aria-label="Search" />
			</div>
			<div class="btns">
				<button>Search</button>
				<select aria-label="Filter">
					<option>All</option>
					<option>Newest</option>
					<option>Popular</option>
				</select>
			</div>
		</div>
		<div class="content">
			<p>Hover and focus highlight interactive components. Everything is aligned with Flexbox in a card-like container and a soft gradient background.</p>
		</div>
	</div>
</body>
</html>

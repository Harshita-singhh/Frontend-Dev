<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box-Sizing Comparison</title>
<style>
	:root { --bg:#f8fafc; --text:#0f172a; --a:#fde68a; --b:#a7f3d0; }
	* { box-sizing: border-box; }
	body { margin:0; min-height: 100vh; display:flex; align-items:center; justify-content:center; background: var(--bg); font-family: Inter, system-ui, Segoe UI, Roboto, Arial; color: var(--text); }
	.container { width: min(900px, 94vw); display:flex; gap:16px; flex-wrap:wrap; align-items:flex-start; justify-content:center; }
	.box {
		width: 300px; border: 4px solid #0ea5e9; border-radius: 12px; padding: 24px; background: #fff; box-shadow:0 10px 28px rgba(0,0,0,.08);
	}
	.header { text-align:center; margin-bottom: 10px; }
	.row { display:flex; gap: 12px; align-items:stretch; justify-content:center; }
	.col {
		flex: 0 1 320px;
	}
	.demo { height: 140px; background: var(--a); border:4px solid #f59e0b; padding: 20px; }
	.demo-alt { height: 140px; background: var(--b); border:4px solid #10b981; padding: 20px; }
	.caption { font-size: 14px; color:#475569; margin-top: 8px; }

	/* Left: default content-box (total width = width + padding + border) */
	.content-box .demo { box-sizing: content-box; }

	/* Right: border-box (total width includes padding and border) */
	.border-box .demo-alt { box-sizing: border-box; }
</style>
</head>
<body>
	<div class="container">
		<div class="col content-box">
			<div class="box">
				<h2 class="header">Default (content-box)</h2>
				<div class="demo">Width is content only, padding and border add to total size.</div>
				<p class="caption">Same declared width and padding, but appears larger overall.</p>
			</div>
		</div>
		<div class="col border-box">
			<div class="box">
				<h2 class="header">border-box</h2>
				<div class="demo-alt">Total includes content + padding + border within width.</div>
				<p class="caption">Equal declared width and padding; overall size is smaller than content-box.</p>
			</div>
		</div>
	</div>
</body>
</html>

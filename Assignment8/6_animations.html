<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Animations Demo</title>
<style>
	:root { --bg:#0b1020; --card:#121833; --text:#e5e7eb; --accent:#60a5fa; --accent2:#34d399; }
	* { box-sizing: border-box; }
	body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; font-family: Inter, system-ui, Segoe UI, Roboto; background: radial-gradient(1200px 800px at 50% -10%, #1f2a56, #0b1020); color: var(--text); }
	.stage { display:flex; gap:22px; flex-wrap:wrap; align-items:center; justify-content:center; padding: 20px; }
	.panel { background: var(--card); border-radius: 14px; padding: 16px; width: 260px; box-shadow: 0 18px 40px rgba(0,0,0,.3); }
	.title { margin: 0 0 8px; }
	.box, .ball, .text-anim { display:grid; place-items:center; border-radius:12px; height:120px; background:#0f172a; }

	/* 1) Moving box */
	@keyframes slideX {
		0% { transform: translateX(-40px); }
		50% { transform: translateX(40px); }
		100% { transform: translateX(-40px); }
	}
	.box div { width: 40px; height: 40px; background: var(--accent); border-radius:8px; }
	.box div { animation: slideX 2s ease-in-out infinite; animation-direction: alternate; }

	/* 2) Bouncing ball */
	@keyframes bounce {
		0%, 100% { transform: translateY(0); }
		50% { transform: translateY(-28px); }
	}
	.ball div {
		width: 28px; height: 28px; background: var(--accent2); border-radius: 50%;
		animation: bounce 1.2s ease-in-out infinite; animation-delay: .2s;
	}

	/* 3) Color-changing text */
	@keyframes hue {
		0% { filter: hue-rotate(0deg); opacity: .7; }
		50% { filter: hue-rotate(140deg); opacity: 1; }
		100% { filter: hue-rotate(0deg); opacity: .7; }
	}
	.text-anim span {
		font-weight: 700; font-size: 20px; color:#fff;
		animation: hue 3s ease-in-out infinite; animation-iteration-count: infinite;
	}
</style>
</head>
<body>
	<div class="stage">
		<div class="panel">
			<h3 class="title">Moving Box</h3>
			<div class="box"><div></div></div>
			<small>Uses @keyframes, ease-in-out, infinite, and direction alternate.</small>
		</div>
		<div class="panel">
			<h3 class="title">Bouncing Ball</h3>
			<div class="ball"><div></div></div>
			<small>Animation with delay and smooth timing function.</small>
		</div>
		<div class="panel">
			<h3 class="title">Color-Changing Text</h3>
			<div class="text-anim"><span>Smooth Hue Shift</span></div>
			<small>Repeating animation that modulates hue and opacity.</small>
		</div>
	</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Mini UI Layout</title>
<style>
	:root { --bg:#f1f5f9; --card:#ffffff; --text:#0f172a; --muted:#6b7280; --primary:#2563eb; }
	* { box-sizing: border-box; }
	html, body { height: 100%; }
	body { margin:0; font-family: Inter, system-ui, Segoe UI, Roboto; color: var(--text); background: var(--bg); display:flex; flex-direction:column; }
	header, footer {
		background:#fff; box-shadow: 0 8px 20px rgba(0,0,0,.06); padding: 14px 16px;
	}
	header .bar {
		max-width: 1100px; margin: 0 auto; display:flex; align-items:center; justify-content:space-between; gap: 10px;
	}
	main {
		flex: 1; display:flex; align-items:center; justify-content:center; padding: 16px;
	}
	.card {
		width: min(920px, 95vw);
		background: var(--card);
		border-radius: 16px;
		box-shadow: 0 18px 48px rgba(0,0,0,.1);
		display:grid; grid-template-columns: 1fr 280px; gap: 16px; padding: 16px;
	}
	@media (max-width: 800px) {
		.card { grid-template-columns: 1fr; }
	}
	.preview {
		display:flex; align-items:center; justify-content:center; background:#f8fafc; border:1px solid #e5e7eb; border-radius:12px; padding: 10px;
	}
	.preview img {
		max-width: 100%; border-radius: 10px; box-shadow: 0 10px 24px rgba(0,0,0,.08);
	}
	form {
		display:flex; flex-direction:column; gap: 10px; background:#f8fafc; border:1px solid #e5e7eb; border-radius: 12px; padding: 12px;
	}
	label { font-weight: 600; }
	input, select, button, textarea {
		font: inherit; padding: 10px 12px; border-radius: 10px; border:1px solid #e2e8f0; background:#fff; transition:.2s; }
	input:focus, select:focus, textarea:focus { outline: 3px solid rgba(37,99,235,.3); outline-offset:2px; }
	button {
		background: var(--primary); color:#fff; cursor:pointer; box-shadow: 0 10px 22px rgba(37,99,235,.25);
	}
	button:hover { filter: brightness(.97); }
	button:active { transform: scale(.98); }
	.controls { display:flex; gap: 8px; flex-wrap: wrap; }
	footer { text-align:center; color: var(--muted); }
</style>
</head>
<body>
	<header>
		<div class="bar">
			<strong>Site Header</strong>
			<nav>Home · About · Contact</nav>
		</div>
	</header>
	<main>
		<section class="card">
			<div class="preview">
				<img src="https://images.unsplash.com/photo-1517816434381-5ac6f2a83ca5?q=80&w=1200&auto=format&fit=crop" alt="Preview" />
			</div>
			<div>
				<form>
					<label for="name">Name</label>
					<input id="name" type="text" placeholder="Your name" />

					<label for="email">Email</label>
					<input id="email" type="email" placeholder="you@example.com" />

					<label for="topic">Topic</label>
					<select id="topic">
						<option>General</option>
						<option>Support</option>
						<option>Feedback</option>
					</select>

					<label for="msg">Message</label>
					<textarea id="msg" rows="3" placeholder="Type here..."></textarea>

					<div class="controls">
						<button type="submit">Submit</button>
						<button type="button" style="background:#64748b">Cancel</button>
					</div>
				</form>
			</div>
		</section>
	</main>
	<footer>
		<small>&copy; Mini UI Layout Footer</small>
	</footer>
</body>
</html>

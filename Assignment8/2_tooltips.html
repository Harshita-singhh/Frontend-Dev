<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSS Tooltips Demo</title>
<style>
	:root { --text:#111827; --muted:#6b7280; --bg:#f9fafb; --card:#ffffff; --primary:#2563eb; }
	* { box-sizing: border-box; }
	body { margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; background: var(--bg); color: var(--text); }
	h1 { text-align:center; margin: 24px 0; }
	.wrapper {
		min-height: 100vh;
		display: flex;
		align-items: center;
		justify-content: center;
		padding: 20px;
	}
	.board {
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 20px;
		flex-wrap: wrap;
		background: var(--card);
		padding: 20px;
		border-radius: 14px;
		box-shadow: 0 10px 30px rgba(0,0,0,.08);
	}
	.item {
		position: relative;
		padding: 12px 16px;
		background: #eef2ff;
		color: #312e81;
		border-radius: 10px;
		cursor: default;
	}
	.tooltip {
		position: absolute;
		left: 50%;
		bottom: calc(100% + 10px);
		transform: translateX(-50%);
		background: #111827;
		color: #fff;
		font-size: 13px;
		padding: 8px 10px;
		border-radius: 8px;
		opacity: 0;
		pointer-events: none;
		transition: opacity .3s ease-in-out, transform .3s ease-in-out;
		white-space: nowrap;
	}
	.tooltip::after {
		content: "";
		position: absolute;
		top: 100%;
		left: 50%;
		transform: translateX(-50%);
		border: 6px solid transparent;
		border-top-color: #111827;
	}
	/* Show on hover */
	.item:hover .tooltip {
		opacity: 1;
		transform: translateX(-50%) translateY(-2px);
	}
</style>
</head>
<body>
	<h1>2) CSS-Only Tooltip Demonstration</h1>
	<div class="wrapper">
		<div class="board">
			<div class="item">
				<span>ℹ️ Info</span>
				<span class="tooltip">General information tooltip</span>
			</div>
			<div class="item">
				<span>🔍 Search</span>
				<span class="tooltip">Type a keyword to search</span>
			</div>
			<div class="item">
				<span>⚙️ Settings</span>
				<span class="tooltip">Open preferences and options</span>
			</div>
			<div class="item">
				<span>⭐ Favorite</span>
				<span class="tooltip">Add to favorites</span>
			</div>
		</div>
	</div>
</body>
</html>

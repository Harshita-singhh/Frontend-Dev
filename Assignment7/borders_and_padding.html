<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding Demo</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        .box {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: border-color 0.3s ease;
        }

        .box:hover {
            border-color: #ff6b6b;
        }

        .box1 {
            border: 5px solid #333;
            padding: 10px;
            border-radius: 5px;
        }

        .box2 {
            border: 5px dashed #333;
            padding: 20px;
            border-radius: 15px;
        }

        .box3 {
            border: 5px double #333;
            padding: 30px;
            border-radius: 25px;
        }

        .box4 {
            border: 5px groove #333;
            padding: 40px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box box1">Solid Border<br>10px Padding</div>
        <div class="box box2">Dashed Border<br>20px Padding</div>
        <div class="box box3">Double Border<br>30px Padding</div>
        <div class="box box4">Groove Border<br>40px Padding</div>
    </div>
</body>
</html>
